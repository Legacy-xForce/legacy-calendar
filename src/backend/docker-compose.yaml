services:
  server:
    image: ghcr.io/iquickdev/legacy-calendar-server:latest
    container_name: legacy-calendar-server
    restart: always
    ports:
      - "3001:3000"
    expose:
      - "3000"
    # Lets Coolify (and plain Docker) gate the deployment on real readiness.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # The image runs from /usr/src/app (Dockerfile WORKDIR), so config, uploads
      # and secrets must be mounted there for process.cwd()-relative lookups.
      - /home/ubuntu/legacy_calendar_data/firebase.json:/usr/src/app/firebase.json
      - /home/ubuntu/legacy_calendar_data/.env:/usr/src/app/.env
      - /home/ubuntu/legacy_calendar_data/uploads:/usr/src/app/uploads
      - /home/ubuntu/legacy_calendar_data/secrets:/usr/src/app/secrets
    env_file:
      - /home/ubuntu/legacy_calendar_data/.env
