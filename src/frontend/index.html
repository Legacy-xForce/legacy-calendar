<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="darkreader-lock" />
  <script>
    // Apply the saved theme before the first paint to avoid a flash of the default palette.
    (() => {
      try {
        const themes = ['oled', 'catppuccin-mocha', 'catppuccin-macchiato', 'catppuccin-frappe', 'catppuccin-latte'];
        const stored = localStorage.getItem('pref_theme');
        const theme = themes.includes(stored) ? stored : 'oled';
        const light = theme === 'catppuccin-latte';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', !light);
        document.documentElement.style.colorScheme = light ? 'light' : 'dark';
      } catch {
        // Storage can be unavailable; fall through to the dark OLED defaults.
      }
    })();
  </script>
  <link rel="preconnect" href="https://legacy-calendar.duckdns.org:3001" crossorigin />
  <link rel="dns-prefetch" href="https://legacy-calendar.duckdns.org:3001" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Outfit:wght@500..700&family=Noto+Color+Emoji&display=swap" />
  <title>Legacy Calendar</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
