name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prisma/generated is gitignored, so the client must exist before tsc.
      - name: Generate Prisma client
        run: bun run generate

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      - name: Check OpenAPI document is current
        run: |
          bun run generate:openapi
          git diff --exit-code openapi.json

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  frontend:
    name: Frontend (typecheck + build + lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated API types are current
        run: |
          bun run generate:api
          git diff --exit-code src/types/api.generated.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck and build
        run: bun run build
